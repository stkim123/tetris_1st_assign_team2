level_3_monster.interaction.monster=교재 처음부터 끝까지다!
level_3_monster.hp=허허… 제법이구만. 대학원에 들어오지 않겠나?
level_3_monster.strong=킬러 문항 투하! 이건 수업에서 안 다뤘지만 교재에는 있다!
