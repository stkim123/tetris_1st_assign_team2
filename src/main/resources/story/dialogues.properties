level_2_monster.encounter=교양은 쉽다고? 그 말, 시험 끝나고도 할 수 있을까?
level_2_monster.interaction.player=교양 하나만 들으러 왔는데요?
level_2_monster.interaction.monster=과제는 다섯 개다!
level_2_monster.hp=말도 안 돼! 교양은 학점 날먹 과목이란 말이다!
level_2_monster.strong=조별 과제 최종 발표다! 질문은 세 개!
level_2_monster.crisis=팀원들이 잠수 중인데… 네가 혼자 할 수 있겠느냐?!
level_2_monster.playerLoss.monster=출석 점수는 0점이다!
level_2_monster.playerWin.monster=좋아… A+를 주마…
level_2_monster.playerWin.player=교양 하나 끝냈다! 이제 전공 과목을…
level_2_monster.playerLoss.player=안 돼… 이러다 졸업 학점 못 채우겠어!

