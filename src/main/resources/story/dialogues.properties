# PvE 몬스터 대사 (Tetris_Monster_PVE_Stage_Dialogues.docx 기준). UTF-8.
# 키: <전투 ID>.<상황>   playerWin = 플레이어가 이긴 결과, playerLoss = 플레이어가 진 결과
#   encounter = 조우, interaction.* = 시작 30초 뒤 대화(플레이어→몬스터), hp = HP 감소, strong = 강공격(4줄 제거), crisis = 위기(HP 20% 이하)

# 1. 술
level_1_monster.encounter=신입생인가? 좋아! 오늘은 내가 네 간을 시험해 주마!
level_1_monster.interaction.player=저 내일 9시 수업인데요?
level_1_monster.interaction.monster=그런 건 2차에서 생각하는 거다!
level_1_monster.hp=어어?! 아직 1차도 안 끝났는데?!
level_1_monster.strong=폭탄주 콤보오오오!
level_1_monster.crisis=아직 집에 보낼 순 없다…!
level_1_monster.playerLoss.monster=으하하! 오늘은 내가 쏜다! 3차 가자!
level_1_monster.playerWin.monster=크으… 오늘은 네가 계산해라…
level_1_monster.playerWin.player=후… 오늘은 1차만 하고 집에 가겠습니다.
level_1_monster.playerLoss.player=으윽… 속이 안 좋아…

